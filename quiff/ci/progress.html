<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quiff · Pipeline</title>
  <style>
    :root{color-scheme:light;--ink:#252b28;--muted:#858d87;--line:#e9ece8;--green:#3c765b}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:#f7f9f7;color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:grid;place-items:center;padding:32px 20px}
    .shell{width:min(100%,780px)}.brand{display:flex;align-items:center;gap:11px;margin-bottom:28px;font-size:14px;font-weight:650;letter-spacing:.01em}.mark{width:34px;height:34px;border-radius:11px;background:#e8f0e9;color:#3c765b;display:grid;place-items:center;font-size:19px}
    .card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:36px 40px;box-shadow:0 16px 50px #24392b0a}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:20px}.eyebrow{margin:0 0 7px;text-transform:uppercase;letter-spacing:.14em;font-size:10px;font-weight:700;color:var(--muted)}h1{font-size:26px;line-height:1.2;letter-spacing:-.04em;margin:0}.subtitle{color:var(--muted);margin:9px 0 0;font-size:13px}.badge{white-space:nowrap;border-radius:20px;background:#f2f5f2;padding:7px 11px;color:#617168;font-size:11px;font-weight:650}.badge.running{background:#f2f6f8;color:#66849a}.badge.done{background:#edf5ef;color:#3d7656}.badge.failed{background:#fbefed;color:#b05247}
    .progress{height:6px;border-radius:8px;background:#edf0ed;margin:30px 0 27px;overflow:hidden}.bar{height:100%;width:0;background:linear-gradient(90deg,#8db49a,#477b5e);border-radius:8px;transition:width .55s cubic-bezier(.2,.7,.2,1)}.steps{display:grid;gap:0}.step{display:grid;grid-template-columns:36px 1fr auto;align-items:center;min-height:66px;border-bottom:1px solid #f0f2ef}.step:last-child{border:0}.icon{width:26px;height:26px;border-radius:50%;background:#f0f2ef;color:#98a099;display:grid;place-items:center;font-size:12px;transition:all .25s}.step.active .icon{background:#eaf2ec;color:#397153;box-shadow:0 0 0 5px #f5f8f5;animation:pulse 1.8s infinite}.step.complete .icon{background:#eaf3eb;color:#3e7958}.step.failed .icon{background:#faeeeb;color:#b05247}.step.skipped .icon{background:#f6f7f5;color:#afb5af}.step.skipped .label,.step.skipped .detail{color:#a1a8a2}.label{font-size:13px;font-weight:600}.detail{font-size:11px;color:var(--muted);margin-top:2px}.state{font-size:11px;color:#a2a9a3}.step.active .state{color:#668774}.step.failed .state{color:#b05247}
    .finding{margin-top:22px;padding:21px 22px;background:#fbfcfb;border:1px solid #edf0ec;border-radius:14px}.finding[hidden]{display:none}.finding-top{display:flex;align-items:center;justify-content:space-between;gap:10px}.finding h2{font-size:16px;line-height:1.35;margin:0;letter-spacing:-.02em}.confidence{padding:5px 9px;border-radius:16px;background:#eef4ef;color:#4e765b;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em}.confidence.none{background:#f2f3f1;color:#777f78}.finding-summary{margin:10px 0 14px;color:#68716b;font-size:12px;line-height:1.6}.finding-links{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 18px}.finding-link{display:inline-flex;gap:5px;align-items:center;padding:7px 10px;border:1px solid #e9ede8;border-radius:8px;background:#fff;color:#456c53;text-decoration:none;font-size:11px;font-weight:600}.finding-link:hover{text-decoration:underline}.finding h3{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:#838c85;margin:17px 0 7px}.finding ul{padding-left:17px;margin:0;color:#68716b;font-size:11px;line-height:1.65}.finding li+li{margin-top:4px}.finding details{margin-top:13px;color:#717a73;font-size:11px}.finding summary{cursor:pointer;font-weight:600}.analysis-error{margin:10px 0 0;padding:9px 11px;border-radius:8px;background:#fbf2f0;color:#a64e44;font-size:11px}.analysis-error[hidden]{display:none}
    .test-run{margin-top:14px;padding:16px 17px;border:1px solid #e9ede8;border-radius:12px;background:#fbfcfb}.test-run[hidden]{display:none}.test-run-head{display:flex;align-items:center;justify-content:space-between;gap:12px}.test-run h2{margin:0;font-size:13px;letter-spacing:-.01em}.test-counts{color:#718078;font-size:10px;text-align:right}.test-progress{height:4px;margin:11px 0 10px;overflow:hidden;border-radius:8px;background:#e9eeea}.test-progress-bar{width:0;height:100%;background:#5c8c69;transition:width .3s ease}.test-list{display:grid;gap:0;margin:0;padding:0;list-style:none}.test-case{display:grid;grid-template-columns:22px minmax(0,1fr) auto;align-items:center;gap:8px;min-height:34px;border-top:1px solid #eef1ee}.test-case:first-child{border-top:0}.test-case-icon{display:grid;width:18px;height:18px;place-items:center;border-radius:50%;color:#89948c;background:#edf1ed;font-size:10px;font-weight:700}.test-case-name{min-width:0;color:#48574d;font-size:10px;line-height:1.4;overflow-wrap:anywhere}.test-case-status{color:#87928a;font-size:9px;white-space:nowrap}.test-case.running .test-case-icon{color:#397153;background:#eaf2ec;animation:blink 1.2s infinite}.test-case.running .test-case-status{color:#52765f}.test-case.passed .test-case-icon{color:#286242;background:#e6f0e8}.test-case.passed .test-case-status{color:#286242}.test-case.failed .test-case-icon,.test-case.broken .test-case-icon{color:#a63e35;background:#fbefed}.test-case.failed .test-case-status,.test-case.broken .test-case-status{color:#a63e35}.test-case.skipped .test-case-status{color:#9aa39c}
    .foot{margin-top:23px;padding-top:19px;border-top:1px solid #f0f2ef;display:flex;justify-content:space-between;gap:16px;color:var(--muted);font-size:11px}.foot strong{color:#667169;font-weight:550}.pulse-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#8baa95;margin-right:6px;animation:blink 1.5s infinite}@keyframes pulse{50%{box-shadow:0 0 0 8px #f5f8f5}}@keyframes blink{50%{opacity:.35}}@media(max-width:560px){.card{padding:27px 22px}.top{align-items:flex-start}h1{font-size:23px}.step{grid-template-columns:34px 1fr auto}.foot{flex-direction:column;gap:4px}.finding{padding:18px 16px}.finding-top{align-items:flex-start}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
  </style>
</head>
<body>
  <main class="shell">
    <div class="brand"><span class="mark" aria-hidden="true">↗</span><span>Quiff <span style="font-weight:400;color:#929a94">/ local pipeline</span></span></div>
    <section class="card" aria-live="polite">
      <div class="top"><div><p class="eyebrow">Continuous integration</p><h1 id="title">Preparing your pipeline</h1><p class="subtitle" id="message">Starting the progress dashboard…</p></div><span class="badge running" id="badge">Starting</span></div>
      <div class="progress" aria-label="Pipeline progress"><div class="bar" id="bar"></div></div>
      <div class="steps" id="steps"></div>
      <section class="test-run" id="test-run" aria-live="polite" hidden>
        <div class="test-run-head"><h2>Running Kane tests</h2><span class="test-counts" id="test-counts">Preparing test plan…</span></div>
        <div class="test-progress" role="progressbar" aria-label="Kane test progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="test-progress-bar" id="test-progress-bar"></div></div>
        <ul class="test-list" id="test-list"></ul>
      </section>
      <section class="finding" id="finding" aria-live="polite" hidden>
        <div class="finding-top"><h2 id="finding-title"></h2><span class="confidence" id="finding-confidence"></span></div>
        <p class="finding-summary" id="finding-summary"></p>
        <div class="finding-links" id="finding-links"></div>
        <h3>Evidence</h3><ul id="finding-evidence"></ul>
        <details id="finding-details" hidden>
          <summary>Other candidates and open questions</summary>
          <h3>Alternatives</h3><ul id="finding-alternatives"></ul>
          <h3>Gaps</h3><ul id="finding-gaps"></ul>
        </details>
      </section>
      <p class="analysis-error" id="analysis-error" hidden></p>
      <div class="foot"><span id="connection"><i class="pulse-dot"></i>Live pipeline updates</span><strong>Docker · Kane CLI</strong></div>
    </section>
  </main>
  <script>
    const steps=[['Check prerequisites','Confirm Docker, Kane CLI, and the local port are ready.'],['Build app image','Create the Docker image for the signup app.'],['Start app container','Launch the app for the browser checks.'],['Wait for app health','Check that the app responds at localhost:3000.'],['Run saved Kane tests','Run each selected test and report its live status.'],['Find likely ticket and change','Codex compares the failure with tickets, PRs, and diffs.'],['Clean up','Stop and remove the temporary app container.']];
    let testCases=[];
    const root=document.getElementById('steps');
    root.replaceChildren(...steps.map((step,index)=>{const row=document.createElement('div');row.className='step';row.id=`step-${index+1}`;const icon=document.createElement('span');icon.className='icon';icon.textContent=String(index+1);const copy=document.createElement('div');const label=document.createElement('div');label.className='label';label.textContent=step[0];const detail=document.createElement('div');detail.className='detail';detail.textContent=step[1];copy.append(label,detail);const state=document.createElement('span');state.className='state';state.textContent='Waiting';row.append(icon,copy,state);return row}));
    function renderTestCases(){const panel=document.getElementById('test-run'),list=document.getElementById('test-list');panel.hidden=testCases.length===0;list.replaceChildren();let passed=0,failed=0,broken=0,skipped=0,completed=0;for(const test of testCases){const status=test.status||'pending';if(status==='passed')passed++;if(status==='failed')failed++;if(status==='broken')broken++;if(status==='skipped')skipped++;if(['passed','failed','broken','skipped'].includes(status))completed++;const row=document.createElement('li');row.className=`test-case ${status}`;const icon=document.createElement('span');icon.className='test-case-icon';icon.textContent=status==='passed'?'✓':status==='failed'||status==='broken'?'!':status==='running'?'↻':status==='skipped'?'–':'·';const name=document.createElement('span');name.className='test-case-name';name.textContent=test.name||test.path;const state=document.createElement('span');state.className='test-case-status';state.textContent=status==='pending'?'Waiting':status==='running'?'Running':status[0].toUpperCase()+status.slice(1);if(test.duration_s!=null)state.textContent+=` · ${Number(test.duration_s).toFixed(1)}s`;if(test.failure?.message)row.title=test.failure.message;row.append(icon,name,state);list.append(row)}const total=testCases.length,percent=total?Math.round(completed/total*100):0;document.getElementById('test-counts').textContent=`${completed}/${total} finished · ${passed} passed · ${failed} failed · ${broken} broken · ${skipped} skipped`;document.getElementById('test-progress-bar').style.width=percent+'%';document.querySelector('[aria-label="Kane test progress"]').setAttribute('aria-valuenow',String(percent))}
    function appendItems(container,items,emptyText){container.replaceChildren();if(!items?.length){const li=document.createElement('li');li.textContent=emptyText;container.append(li);return}for(const item of items){const li=document.createElement('li');if(typeof item==='string')li.textContent=item;else if(item.candidate)li.textContent=`${item.candidate} — ${item.reason||''}`;else li.textContent=`${item.source?`${item.source}: `:''}${item.reference?`${item.reference} — `:''}${item.supports||''}`;container.append(li)}}
    function addLink(container,label,value,url){if(!value)return;const link=document.createElement(url?'a':'span');link.className='finding-link';link.textContent=`${label}: ${value}`;if(url){try{const parsed=new URL(url);if(parsed.protocol==='http:'||parsed.protocol==='https:'){link.href=parsed.href;link.target='_blank';link.rel='noreferrer'}}catch{}}container.append(link)}
    function renderFinding(finding){if(!finding||typeof finding!=='object')return;const panel=document.getElementById('finding');panel.hidden=false;const attributed=finding.status==='attributed',a=finding.attribution;document.getElementById('finding-title').textContent=attributed?`Likely introduced by ${a?.person?.name||'unknown'}`:'Attribution inconclusive';const confidence=document.getElementById('finding-confidence');confidence.textContent=`${finding.confidence||'none'} confidence`;confidence.className='confidence '+(finding.confidence==='none'?'none':'');document.getElementById('finding-summary').textContent=finding.summary||'';const links=document.getElementById('finding-links');links.replaceChildren();if(attributed&&a){addLink(links,'Ticket',`${a.ticket.id} · ${a.ticket.title}`,/^https?:\/\//.test(a.ticket.reference)?a.ticket.reference:null);addLink(links,'PR',`#${a.pull_request.number} · ${a.pull_request.title}`,a.pull_request.url);if(a.change?.commit_sha)addLink(links,'Commit',a.change.commit_sha.slice(0,10),`https://github.com/Witchio/quiff-ai/commit/${a.change.commit_sha}`);if(a.change?.files?.length)addLink(links,'Files',`${a.change.files.length} changed`,null)}appendItems(document.getElementById('finding-evidence'),finding.evidence,'No supporting evidence was returned.');const details=document.getElementById('finding-details');const hasDetails=Boolean(finding.alternatives?.length||finding.gaps?.length);details.hidden=!hasDetails;if(hasDetails){appendItems(document.getElementById('finding-alternatives'),finding.alternatives,'None identified.');appendItems(document.getElementById('finding-gaps'),finding.gaps,'No open evidence gaps reported.')}}
    function update(data){const current=Number(data.step)||0,completed=new Set(data.completedSteps||[]),failed=new Set(data.failedSteps||[]),skipped=new Set(data.skippedSteps||[]);if(Array.isArray(data.testCases)){testCases=data.testCases;renderTestCases()}if(data.status==='success'&&!data.completedSteps)steps.forEach((_,i)=>completed.add(i+1));if(data.status==='failed'&&!data.failedSteps&&current)failed.add(current);document.getElementById('bar').style.width=(data.status==='success'?100:data.status==='failed'?Math.min(96,completed.size/steps.length*100):Math.min(96,current/steps.length*100))+'%';document.getElementById('title').textContent=data.title||(data.status==='success'?'Pipeline completed':data.status==='failed'?'Pipeline failed':'Pipeline in progress');document.getElementById('message').textContent=data.message||'';const badge=document.getElementById('badge');badge.textContent=data.status==='success'?'Complete':data.status==='failed'?'Failed':data.status==='starting'?'Starting':'In progress';badge.className='badge '+(data.status==='success'?'done':data.status==='failed'?'failed':'running');steps.forEach((_,i)=>{const n=i+1,el=document.getElementById(`step-${n}`),state=el.querySelector('.state'),icon=el.querySelector('.icon');if(failed.has(n)){el.className='step failed';state.textContent='Failed';icon.textContent='!'}else if(completed.has(n)){el.className='step complete';state.textContent='Complete';icon.textContent='✓'}else if(skipped.has(n)){el.className='step skipped';state.textContent='Skipped';icon.textContent='–'}else if(n===current&&data.status!=='success'&&data.status!=='failed'){el.className='step active';state.textContent='In progress';icon.textContent='↻'}else{el.className='step';state.textContent='Waiting';icon.textContent=String(n)}});if(data.finding)renderFinding(data.finding);const error=document.getElementById('analysis-error');error.hidden=!data.analysisError;if(data.analysisError)error.textContent=data.analysisError;if(data.status==='success')document.getElementById('connection').textContent='✓ Kane checks passed · attribution skipped';else if(data.status==='failed'&&data.finding)document.getElementById('connection').textContent='Kane checks failed · attribution result ready';else if(data.status==='failed')document.getElementById('connection').textContent='Pipeline stopped · see terminal for details'}
    const events=new EventSource('/events');events.onmessage=e=>update(JSON.parse(e.data));events.onerror=()=>{const status=document.getElementById('badge').textContent;if(status!=='Complete'&&status!=='Failed')document.getElementById('connection').textContent='Reconnecting to pipeline…'};
  </script>
</body>
</html>
